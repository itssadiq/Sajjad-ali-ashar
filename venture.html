<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venture Details | Sajjad Ali Ashar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Geist"', 'Arial', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer base {
            :root {
                --black: #080808;
                --dark-text: #212121;
                --white: #fafafa;
                --off-white: #F8F7F7;
                --light-gray: #E6E6E6;
                --border-gray: #CFCFCF;
                --muted-gray: #B5B5B5;
                --raised-dark: #262626;

                --bg-dark: var(--black);
                --bg-light: var(--white);
                --text-dark-primary: var(--dark-text);
            }

            body {
                background-color: var(--bg-light);
                color: var(--text-dark-primary);
                font-family: 'Geist', Arial, sans-serif;
                -webkit-font-smoothing: antialiased;
            }
            .heading-h1 { font-weight: 700; font-size: 64px; line-height: 1.1; letter-spacing: -0.02em; }
            .heading-h2 { font-weight: 700; font-size: 48px; line-height: 1.1; letter-spacing: -0.02em; }
            .heading-h3 { font-weight: 600; font-size: 35px; line-height: 1.2; }
            .heading-h5 { font-weight: 700; font-size: 24px; line-height: 1.2; }
            .eyebrow-h6 { font-weight: 700; font-size: 14px; line-height: 1.2; letter-spacing: 0.04em; text-transform: uppercase; }
            .body-longform { font-weight: 400; font-size: 18px; line-height: 1.6; letter-spacing: -0.02em; }
        }
        ::-webkit-scrollbar { display: none; }
        
        @media (max-width: 1024px) {
            .heading-h1 { font-size: 48px; }
        }
    </style>
</head>
<body class="min-h-full flex flex-col">
    <!-- Navbar -->
    <div class="fixed top-0 left-0 w-full flex justify-center z-50 pointer-events-none">
        <div class="w-full max-w-[1440px] px-6 sm:px-12 lg:px-24 py-6 sm:py-8 lg:py-12 pointer-events-auto">
            <header class="w-full flex justify-end items-start z-50 h-10 relative">
                <button type="button" id="menu-btn" class="text-[var(--white)] bg-[#111] border border-[#333] hover:border-[var(--white)] rounded-full px-6 py-2.5 text-lg font-medium transition-colors duration-200 cursor-pointer focus:outline-none focus:ring-1 focus:ring-white opacity-100 block">Menu</button>
                <div id="menu-dropdown" class="absolute top-0 right-0 bg-[#0a0a0a] border border-[#333333] rounded-2xl p-6 min-w-[240px] shadow-2xl flex flex-col z-50 transition-all duration-300 transform origin-top-right opacity-0 scale-95 pointer-events-none">
                    <div class="flex justify-between items-start mb-2">
                        <div class="flex flex-col gap-4 mt-1">
                            <a href="index.html" class="menu-link font-semibold text-[17px] transition-colors text-white hover:text-gray-300">Home</a>
                            <a href="about.html" class="menu-link font-semibold text-[17px] transition-colors text-white hover:text-gray-300">About</a>
                            <a href="index.html#books" class="menu-link font-semibold text-[17px] transition-colors text-white hover:text-gray-300">Books</a>
                            <a href="index.html#events" class="menu-link text-white hover:text-gray-300 font-semibold text-[17px]">Events</a>
                            <a href="contact.html" class="menu-link font-semibold text-[17px] transition-colors text-white hover:text-gray-300">Contact</a>
                        </div>
                        <button id="close-btn" class="text-white hover:text-gray-300 font-bold text-[17px] tracking-wide cursor-pointer">Close</button>
                    </div>
                </div>
            </header>
        </div>
    </div>

    <!-- Main Content injected by JS -->
    <div id="venture-content" class="w-full min-h-screen bg-[var(--white)] flex flex-col opacity-0 transition-opacity duration-500">
        <!-- Content will be injected here by JS -->
    </div>
    
    <div id="error-content" class="w-full hidden flex-col items-center justify-center min-h-screen py-20 text-center bg-[var(--white)]">
        <h2 class="heading-h2 text-[var(--black)] mb-6">Venture Not Found</h2>
        <p class="body-longform text-[#B5B5B5] mb-10">We couldn't find the details for this venture.</p>
        <a href="index.html" class="bg-[var(--black)] text-[var(--white)] rounded-full px-8 py-4 font-semibold text-[16px] transition-colors duration-200 hover:bg-[#333]">Back to Home</a>
    </div>

    <!-- Footer -->
    <footer class="bg-[var(--black)] text-[var(--white)] w-full flex justify-center selection:bg-[var(--white)] selection:text-[var(--black)] mt-auto">
        <div class="w-full max-w-[1440px] px-6 sm:px-12 lg:px-24 pt-20 sm:pt-28 pb-10 flex flex-col">
            <div class="flex flex-col lg:flex-row justify-between items-start gap-16 lg:gap-8 mb-24">
                <div class="flex flex-row gap-16 sm:gap-32 lg:gap-40">
                    <div class="flex flex-col gap-6">
                        <span class="text-[#A3A3A3] text-[15px] font-medium tracking-wide">Pages</span>
                        <ul class="flex flex-col gap-5">
                            <li><a href="about.html" class="text-[var(--white)] text-[16px] font-bold hover:text-[#A3A3A3] transition-colors duration-200">About</a></li>
                            <li><a href="index.html#books" class="text-[var(--white)] text-[16px] font-bold hover:text-[#A3A3A3] transition-colors duration-200">Books</a></li>
                            <li><a href="index.html#events" class="text-[var(--white)] text-[16px] font-bold hover:text-[#A3A3A3] transition-colors duration-200">Events</a></li>
                            <li><a href="contact.html" class="text-[var(--white)] text-[16px] font-bold hover:text-[#A3A3A3] transition-colors duration-200">Contact</a></li>
                        </ul>
                    </div>
                    <div class="flex flex-col gap-6">
                        <span class="text-[#A3A3A3] text-[15px] font-medium tracking-wide">Social</span>
                        <ul class="flex flex-col gap-5">
                            <li><a href="https://www.instagram.com/sajjadaliashar/" class="text-[var(--white)] text-[16px] font-bold hover:text-[#A3A3A3] transition-colors duration-200" target="_blank" rel="noopener noreferrer">Instagram</a></li>
                            <li><a href="#" class="text-[var(--white)] text-[16px] font-bold hover:text-[#A3A3A3] transition-colors duration-200">LinkedIn</a></li>
                            <li><a href="https://www.facebook.com/sajjadaliasharr" class="text-[var(--white)] text-[16px] font-bold hover:text-[#A3A3A3] transition-colors duration-200" target="_blank" rel="noopener noreferrer">Facebook</a></li>
                        </ul>
                    </div>
                </div>
                <div class="flex flex-col gap-6 w-full lg:w-auto lg:min-w-[400px]">
                    <span class="text-[var(--white)] text-[18px] sm:text-[20px] font-bold tracking-tight">Get monthly newsletter</span>
                    <form class="flex flex-row items-center gap-3 w-full" onsubmit="event.preventDefault()">
                        <input type="email" placeholder="Your email" class="w-full lg:w-[280px] bg-[#222222] text-white placeholder-[#888888] px-6 py-3.5 rounded-full outline-none focus:ring-1 focus:ring-white transition-all text-[15px]" required />
                        <button type="submit" class="bg-[var(--white)] text-[var(--black)] hover:bg-[#E6E6E6] px-8 py-3.5 rounded-full font-bold text-[15px] transition-colors duration-200">Submit</button>
                    </form>
                </div>
            </div>
            <div class="w-full h-px bg-[#333333] mb-8"></div>
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-6">
                <span class="text-[var(--white)] font-bold text-[14px] sm:text-[15px]">Website by <a href="https://sadiq.novixsoft.com/" target="_blank">Sadiq Ali</a></span>
                <span class="text-[var(--white)] font-bold text-[14px] sm:text-[15px]">© 2026 Sajjad Ali Ashar. All rights reserved.</span>
            </div>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/ventures.js"></script>
    <script src="js/venture-details.js"></script>
</body>
</html>
